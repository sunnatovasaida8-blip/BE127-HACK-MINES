<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE127 - Mines VIP Predictor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: radial-gradient(circle at center, #1b1238 0%, #090514 100%); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        /* VIP Modal */
        .auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 5, 20, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 999; padding: 20px; }
        .auth-card { width: 100%; max-width: 340px; background: rgba(30, 20, 55, 0.9); border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        .auth-card h2 { font-size: 18px; color: #00ffcc; margin-bottom: 10px; }
        .auth-card p { font-size: 12px; color: #aaa; margin-bottom: 15px; }
        .price-tag { display: inline-block; background: rgba(0, 255, 204, 0.15); color: #00ffcc; font-size: 11px; padding: 4px 10px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
        .auth-card input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; color: #fff; font-size: 14px; text-align: center; margin-bottom: 15px; outline: none; }
        .auth-card input:focus { border-color: #00ffcc; }
        .auth-card button { width: 100%; background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-bottom: 15px; }
        .error-msg { color: #ff4d4d; font-size: 11px; margin-top: 10px; }
        
        .admin-box { font-size: 12px; color: #bbb; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; margin-top: 5px; }
        .admin-box a { color: #00ffcc; text-decoration: none; font-weight: bold; }

        /* Asosiy Ilova */
        .container { width: 100%; max-width: 380px; background: rgba(30, 20, 55, 0.75); backdrop-filter: blur(15px); border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 20px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #00ffcc, #ffcc00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { background: rgba(255, 204, 0, 0.15); -webkit-text-fill-color: #ffcc00; font-size: 10px; padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(255, 204, 0, 0.3); }
        .status-bar { font-size: 12px; color: #00ffcc; display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 8px #00ffcc; }
        .settings-card { background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .settings-card label { font-size: 12px; color: #ccaaff; display: block; margin-bottom: 8px; }
        .mines-select { display: flex; gap: 8px; }
        .mine-btn { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .mine-btn.active, .mine-btn:hover { background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; border-color: #00ffcc; }
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
        .cell { aspect-ratio: 1; background: rgba(15, 10, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; transition: 0.3s; }
        .cell.gem { background: rgba(0, 255, 204, 0.25); border-color: #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.6); transform: scale(1.05); }
        .stats-info { display: flex; justify-content: space-between; font-size: 12px; color: #ccaaff; margin-bottom: 15px; padding: 0 5px; }
        .stats-info strong { color: #fff; }
        .signal-btn { width: 100%; background: linear-gradient(135deg, #ffcc00, #ff6600); color: #000; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 20px rgba(255, 204, 0, 0.4); }
        .footer { text-align: center; font-size: 9px; color: #7755aa; margin-top: 15px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- VIP KOD KIRITISH EKRANI (1 SOATGA AMAL QILADI) -->
    <div id="authModal" class="auth-modal">
        <div class="auth-card">
            <h2>🔐 1 SOATLIK VIP ACCESS</h2>
            <p>Ilovadan foydalanish uchun 1 soatlik aktivatsiya kodini kiriting.</p>
            <span class="price-tag">Narxi: 25,000 UZS</span>
            <input type="text" id="vipCodeInput" placeholder="1 soatlik kodni kiriting...">
            <button onclick="verifyCode()">FAOLLASHTIRISH</button>
            <div id="errorMsg" class="error-msg"></div>
            
            <div class="admin-box">
                Kod sotib olish uchun: <a href="https://t.me/ZYNEX2_x27" target="_blank">@ZYNEX2_x27</a>
            </div>
        </div>
    </div>

    <!-- ASOSIY ILOVA -->
    <div class="container" id="mainApp" style="display: none;">
        <header class="header">
            <div class="logo">BE127 <span class="badge">VIP</span></div>
            <div class="status-bar"><span class="dot"></span> Online</div>
        </header>

        <div class="settings-card">
            <label>Minalar sonini tanlang:</label>
            <div class="mines-select">
                <button class="mine-btn active" onclick="setMines(1)">1</button>
                <button class="mine-btn" onclick="setMines(3)">3</button>
                <button class="mine-btn" onclick="setMines(5)">5</button>
                <button class="mine-btn" onclick="setMines(7)">7</button>
            </div>
        </div>

        <div class="grid-container" id="minesGrid"></div>

        <div class="stats-info">
            <span>Aniqlik: <strong id="accuracy">99.2%</strong></span>
            <span>Promo: <strong>BE127</strong></span>
        </div>

        <button class="signal-btn" onclick="getSignal()">SIGNAL OLISH 💎</button>
        <div class="footer">POWERED BY THEEAGLE</div>
    </div>

    <script>
        // Har 1 soatda (3600000 millisekund) kodning amal qilish muddatini tekshiramiz
        window.onload = function() {
            const loginTime = localStorage.getItem('be127_login_time');
            const currentTime = new Date().getTime();
            
            // Agar 1 soat (3600000 ms) o'tmagan bo'lsa, ilovani ochamiz
            if(loginTime && (currentTime - loginTime < 3600000)) {
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            } else {
                localStorage.removeItem('be127_vip_active');
            }
        }

        function verifyCode() {
            const inputCode = document.getElementById('vipCodeInput').value.trim();
            
            // Brauzer localStorage orqali admin paneldan olingan oxirgi kodni tekshiradi
            const activeAdminCode = localStorage.getItem('admin_current_code') || 'BE127VIP';

            if(inputCode === activeAdminCode && inputCode !== "") {
                localStorage.setItem('be127_vip_active', 'true');
                localStorage.setItem('be127_login_time', new Date().getTime()); // Hozirgi vaqtni saqlaymiz
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            } else {
                document.getElementById('errorMsg').innerText = "Kod noto'g'ri yoki eskirgan! Admindan yangi kod oling.";
            }
        }

        let selectedMines = 1;
        function setMines(count) {
            selectedMines = count;
            document.querySelectorAll('.mine-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
        }

        const gridContainer = document.getElementById('minesGrid');
        function createGrid() {
            if(!gridContainer) return;
            gridContainer.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                gridContainer.appendChild(cell);
            }
        }
        createGrid();

        function getSignal() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(c => {
                c.classList.remove('gem');
                c.innerHTML = '';
            });

            let gemCount = selectedMines <= 3 ? 5 : 4;
            let selectedIndices = [];
            while(selectedIndices.length < gemCount) {
                let randomIndex = Math.floor(Math.random() * 25);
                if(!selectedIndices.includes(randomIndex)) selectedIndices.push(randomIndex);
            }

            selectedIndices.forEach((index, i) => {
                setTimeout(() => {
                    let cell = cells[index];
                    if(cell) {
                        cell.classList.add('gem');
                        cell.innerHTML = '💎';
                    }
                }, i * 150);
            });

            let randomAcc = (98 + Math.random() * 1.8).toFixed(1);
            document.getElementById('accuracy').innerText = randomAcc + '%';
        }
    </script>
</body>
</html>
